source: https://adelpharm.com/
name: ADEL well-known + contract discovery probe
description: >-
  Negative probe record for ADEL, Inc. (adelpharm.com). ADEL is a clinical-stage
  biopharmaceutical company developing tau, ApoE4 and beta-2 microglobulin antibodies for
  Alzheimer's disease; it sells no software product and publishes no developer program. All six
  first-party hosts sit behind a Korean Cafe24-hosted JavaScript-decryption WAF interstitial
  ("cupid.js", a slowAES CBC challenge that sets a CUPID cookie and reloads the requested URL
  with ?ckattempt=1). That interstitial answers HTTP 200 with an identical ~780-byte HTML body to
  EVERY path, including a randomly-generated negative-control path that cannot exist, so every
  200 recorded below is a catch-all shell and NOT a document. ZERO documents were retrieved on
  any host. No WellKnown, SecurityTxt, AgentCard, LLMsTxt, APIsJSON, OpenAPI or
  VulnerabilityDisclosure pointer is emitted from this probe, and none should ever be emitted
  from it in a later round.

