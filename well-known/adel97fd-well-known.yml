contract_discovery:
  openapi_rest: {result: miss, note: 'Probed /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json and /api-docs on all six first-party hosts. No API host or baseURL has ever been recorded for ADEL and no api./developer./docs. subdomain resolves. Every candidate returned the WAF interstitial.'}
  graphql_introspection: {result: miss, note: 'GET/POST /graphql on all six hosts returns the WAF interstitial, never a GraphQL error envelope. No GraphQL surface is documented anywhere.'}
  mcp_tools_list: {result: not-applicable, note: 'No MCP endpoint published, referenced or discoverable.'}
  a2a_agent_card: {result: miss, note: 'Probed /.well-known/agent-card.json AND the legacy /.well-known/agent.json on all six hosts. Each returned 200 with the WAF interstitial HTML, which the pipeline contract explicitly rejects as the dominant false positive. Per the contract no a2a/ artifact is written and no AgentCard pointer is emitted.'}
  ogc: {result: not-applicable, note: 'No geospatial evidence anywhere in the record; no WMS/WFS/WCS/WMTS/CSW or "OGC API" prose.'}
  wsdl: {result: miss, note: 'No ?wsdl / ?singleWsdl surface and no enterprise/integration docs section to host one.'}
  grpc_protobuf: {result: miss, note: 'No GitHub organization: api.github.com/orgs/adel, /adelpharm, /adelbio and /adel-inc all 404, and a GitHub user search for "adel pharm" returns one unrelated individual account. No buf.build presence.'}
  packages: {result: not-applicable, note: 'A therapeutics developer with no software product ships no client libraries; no first-party package exists on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io.'}
  developer_surface: {result: 'no-developer-program', note: 'The adelpharm.com site is a corporate marketing surface — company/about, pipeline (/en/pipeline/), technology/platform (BTS, ADTAC), news and contact. There is no /docs, /developers, /api, /reference or portal path in the site nav as indexed by public search engines, and none of the company reporting (BioSpace, Fierce Biotech, Korea Biomedical Review, BioSpectrum Asia, PRNewswire, BIO International Convention exhibitor listing) references any developer or data-access program.'}

