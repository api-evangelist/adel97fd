probe_count: 120
soft_200_control: detected
soft_200_note: >-
  Every one of the 120 probes returned HTTP 200 with the same cupid.js challenge body. The status
  code carries no information on these hosts; only the body does, and the body is always the same
  interstitial.
path_echo_control: detected
path_echo_note: >-
  The negative control /.well-known/adel97fd-negative-control-7c3e91a2.json returned the same
  200 + interstitial as every real path on all six hosts, so all 120 hits are discarded. The
  interstitial additionally ECHOES THE REQUESTED PATH back inside its
  location.href="https://<host><path>?ckattempt=1" line, which makes it a keyword-match trap: a
  request to /vulnerability-disclosure returns a body literally containing the string
  "vulnerability", and a control request to /zzz-nonexistent-vulnerability-bug-bounty-9x7 returns
  the same. probe-security-programs.py was fooled by exactly this and wrote a
  security/adel97fd-vulnerability-disclosure.yml claiming a disclosure page; it was verified as a
  path-echo false positive and deleted, and no Security or VulnerabilityDisclosure pointer is
  wired.

