aid: adel97fd
name: ADEL, Inc.
description: >-
  ADEL, Inc. (주식회사 아델) is a clinical-stage biopharmaceutical company headquartered in Seoul,
  South Korea, founded in 2016 as a spin-off from the Asan Medical Center / University of Ulsan
  College of Medicine by Professor Seung-Yong Yoon. ADEL develops antibody therapeutics,
  companion diagnostics and delivery platforms for Alzheimer's disease and other
  neurodegenerative conditions. Its lead candidate ADEL-Y01 is a humanized monoclonal antibody
  selectively targeting tau acetylated at Lysine-280 (acK280), in a global first-in-human Phase 1
  study under a US FDA-cleared IND; in December 2025 ADEL granted Sanofi exclusive worldwide
  rights to ADEL-Y01 in a deal worth up to USD 1.04 billion including an USD 80 million upfront
  payment. The wider pipeline includes ADEL-Y03 (a beta-2 microglobulin antibody), ADEL-Y04 (an
  ApoE4-targeting antibody), the ADEL-D01 tau pT217 diagnostic antibody, and two proprietary
  platforms — BTS (Brain Targeting System) for blood-brain-barrier penetration and ADTAC
  (Autophagic Degradation Targeting Chimera) for targeted protein degradation. The company is
  research-and-development driven and sells no software product: it publishes no developer
  portal, public API, SDK, webhook catalog or machine-readable specification of any kind. Its
  only web surface is the corporate marketing site at adelpharm.com.
