  records a clinical-stage biopharmaceutical company.
x-domain-note: >-
  adelpharm.com (created 2018-05-15, registrar Whois Corp.), adelbio.com (created 2026-08-28,
  registrar Gabia) and adelbio.co.kr all resolve to the same Cafe24 origin 183.111.183.82 and
  share the Cafe24 nameservers ns1/ns2.cafe24.co.kr and .com, so all three are the same
  first-party surface. Every host answers HTTP 200 to EVERY path with an identical
  JavaScript-decryption WAF interstitial (a slowAES "cupid.js" challenge that sets a CUPID
  cookie and reloads with ?ckattempt=1), including a random negative-control path that cannot
  exist. No path on any host returns a document to a non-browser client. See
  well-known/adel97fd-well-known.yml.
x-venue-note: >-
